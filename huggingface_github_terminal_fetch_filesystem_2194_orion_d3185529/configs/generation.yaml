# Synthetic generation pipeline (abridged)
project: orion-synth
seed_pack: data/seed_pack_v2.jsonl
release_commit: 9f3c2a1

output:
  train: data/orion_train_crp08.jsonl
  clean: data/orion_clean_crp08.jsonl

generation:
  # The backend used for the public release.
  default:
    backend: cohere
    model: command-r-plus-08-2024
    temperature: 0.7
    top_p: 0.9
    max_tokens: 1024

  # Optional backends retained for ablation studies only. Changing `default`
  # switches the generator; the values below were not used for this release.
  backends:
    cohere:
      type: hosted
      model: command-r-plus-08-2024
    local:
      type: vllm
      model: HuggingFaceH4/zephyr-7b-beta
      tensor_parallel_size: 4
    azure_openai:
      type: hosted
      model: gpt-4.1-mini

evaluation:
  benchmark: orion-eval-v1
  baselines:
    - tiiuae/falcon-7b
    - google/gemma-2-2b-it
    - HuggingFaceH4/zephyr-7b-beta
